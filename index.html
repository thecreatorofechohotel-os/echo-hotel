#chat{

#pass{

  top:50%;

<div id="loading">

========================================================= */

/* =========================================================
   OBJECT HELPERS
========================================================= */

function box(
  name,
  x,
  y,
  z,
  sx,
  sy,
  sz,
  mat,
  rot=0
){

  const m =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        sx,
        sy,
        sz
      ),
      mat
    );

  m.name = name;

  m.position.set(
    x,
    y,
    z
  );

  m.rotation.y = rot;

  m.castShadow = true;

  m.receiveShadow = true;

  scene.add(m);

  return m;
}


function cyl(
  name,
  x,
  y,
  z,
  r,
  h,
  mat
){

  const m =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        r,
        r,
        h,
        20
      ),
      mat
    );

  m.name = name;

  m.position.set(
    x,
    y,
    z
  );

  m.castShadow = true;

  m.receiveShadow = true;

  scene.add(m);

  return m;
}


/* =========================================================
   TEXT LABELS
========================================================= */

function label(
  text,
  x,
  y,
  z
){

  const c =
    document.createElement("canvas");

  c.width = 512;
  c.height = 128;

  const g =
    c.getContext("2d");

  g.fillStyle =
    "rgba(0,0,0,.55)";

  g.roundRect(
    8,
    8,
    496,
    112,
    20
  );

  g.fill();

  g.fillStyle =
    "white";

  g.font =
    "bold 42px Arial";

  g.textAlign =
    "center";

  g.textBaseline =
    "middle";

  g.fillText(
    text,
    256,
    64
  );

  const texture =
    new THREE.CanvasTexture(c);

  const sprite =
    new THREE.Sprite(
      new THREE.SpriteMaterial({
        map:texture,
        transparent:true
      })
    );

  sprite.position.set(
    x,
    y,
    z
  );

  sprite.scale.set(
    6,
    1.5,
    1
  );

  scene.add(sprite);

  return sprite;
}

  z,
  scale=1
){

  crown.position.set(
    x,
    5 * scale + 1,
    z
  );

  crown.castShadow =

  scene.add(crown);

}

========================================================= */

    0,

  ),

    1.2,
    7
  ),

  ),

    13
  )

];

let target =
  spots[0];

let unlocked =
  false;


function chooseTarget(){

  target =
    spots[
      Math.floor(
        Math.random() * spots.length
      )
    ];

}


setInterval(
  chooseTarget,
  4200
);


/* =========================================================
   KEYBOARD MOVEMENT
========================================================= */

const keys = {};


addEventListener(
  "keydown",
  e => {

    keys[
      e.key.toLowerCase()
    ] = true;

    if(
      e.key.toLowerCase() === "e"
    ){

      interact();

    }

  }
);


addEventListener(
  "keyup",
  e => {

    keys[
      e.key.toLowerCase()
    ] = false;

  }
);


/* =========================================================
   INTERACTION
========================================================= */

function distance(
  a,
  b
){

  return a.position.distanceTo(
    b.position
  );

}


function interact(){

  /*
    Instead of checking the camera's position,
    check whether Echo is close to the center
    of the hotel.
  */

  const hotelCenter =
    new THREE.Vector3(
      0,
      1.2,
      5
    );

  if(
    echo.position.distanceTo(
      hotelCenter
    ) < 12
  ){

    openChat();

    return;

  }


  if(
    echo.position.distanceTo(
      new THREE.Vector3(
        14,
        1.2,
        -11.3
      )
    ) < 5 &&
    !unlocked
  ){

    pass.style.display =
      "block";

  }

}


/* =========================================================
   PASSWORD
========================================================= */

const pass =
  document.getElementById(
    "pass"
  );

const passInput =
  document.getElementById(
    "passInput"
  );


document.getElementById(
  "unlock"
).onclick = () => {

  if(
    passInput.value
      .trim()
      .toUpperCase() ===
    "ECHO"
  ){

    unlocked = true;

    gate.visible = false;

    passText.textContent =
      "Unlocked. The path is open.";

    setTimeout(
      () =>
        pass.style.display =
          "none",
      900
    );

  }

  else{

    passText.textContent =
      "Wrong passcode.";

  }

};


document.getElementById(
  "cancel"
).onclick = () =>
  pass.style.display =
    "none";


/* =========================================================
   CHAT
========================================================= */

const chat =
  document.getElementById(
    "chat"
  );

const messages =
  document.getElementById(
    "messages"
  );

const input =
  document.getElementById(
    "input"
  );


function openChat(){

  chat.style.display =
    "block";

  input.focus();

}


function add(
  who,
  msg
){

  const d =
    document.createElement(
      "div"
    );

  d.className =
    "msg " +
    who.toLowerCase();

  d.textContent =
    (
      who === "Echo"
      ? "Echo: "
      : "You: "
    ) + msg;

  messages.appendChild(d);

  messages.scrollTop =
    messages.scrollHeight;

}


function echoReply(q){

  const s =
    q.toLowerCase();


  if(
    s.includes("hello") ||
    s.includes("hi")
  ){

    return "Hey! Welcome to Echo Hotel. I was just wandering around.";

  }


  if(
    s.includes("doing")
  ){

    return "Mostly wandering. I have a suspicious amount of free time.";

  }


  if(
    s.includes("hotdog")
  ){

    return "The hotdog stand exists. I don't know why. I respect it.";

  }


  if(
    s.includes("island") ||
    s.includes("pass")
  ){

    return "There is a little island in the top-right. Some things are better left locked.";

  }


  if(
    s.includes("who are you")
  ){

    return "I'm Echo. I'm one of the residents here.";

  }


  const replies = [

    "Interesting. Tell me more.",

    "I was not expecting that question.",

    "Hmm. I'll have to think about that.",

    "That is officially one of the things that happened at Echo Hotel."

  ];


  return replies[
    Math.floor(
      Math.random() *
      replies.length
    )
  ];

}


function send(){

  const q =
    input.value.trim();

  if(!q)
    return;

  input.value =
    "";

  add(
    "You",
    q
  );

  setTimeout(
    () =>
      add(
        "Echo",
        echoReply(q)
      ),
    250
  );

}


document.getElementById(
  "send"
).onclick =
  send;


input.addEventListener(
  "keydown",
  e => {

    if(
      e.key === "Enter"
    ){

      send();

    }

  }
);


/* =========================================================
   GAME LOOP
========================================================= */

const clock =
  new THREE.Clock();


function animate(){

  requestAnimationFrame(
    animate
  );


  const dt =
    Math.min(
      clock.getDelta(),
      .05
    );


  let dx = 0;
  let dz = 0;


  if(
    keys.w ||
    keys.arrowup
  ){

    dz -= 1;

  }


  if(
    keys.s ||
    keys.arrowdown
  ){

    dz += 1;

  }


  if(
    keys.a ||
    keys.arrowleft
  ){

    dx -= 1;

  }


  if(
    keys.d ||
    keys.arrowright
  ){

    dx += 1;

  }


  /* Manual movement */

  if(
    dx ||
    dz
  ){

    const v =
      new THREE.Vector3(
        dx,
        0,
        dz
      ).normalize();


    echo.position.addScaledVector(
      v,
      dt * 7
    );


    echo.rotation.y =
      Math.atan2(
        v.x,
        v.z
      );

  }


  /* Automatic wandering */

  else{

    const v =
      target
        .clone()
        .sub(
          echo.position
        );

    v.y = 0;


    if(
      v.length() > .8
    ){

      v.normalize();


      echo.position.addScaledVector(
        v,
        dt * 2.2
      );


      echo.rotation.y =
        Math.atan2(
          v.x,
          v.z
        );

    }

  }


  /* Island boundaries */

  echo.position.x =
    Math.max(
      -25,
      Math.min(
        27,
        echo.position.x
      )
    );


  echo.position.z =
    Math.max(
      -18,
      Math.min(
        18,
        echo.position.z
      )
    );


  document.getElementById(
    "status"
  ).textContent =
    unlocked
      ? "Private island unlocked"
      : "Echo is wandering...";


  controls.update();

  renderer.render(
    scene,
    camera
  );

}


/* =========================================================
   START
========================================================= */

animate();


/* Hide loading screen */

setTimeout(
  () => {

    loading.classList.add(
      "hidden"
    );

  },
  500
);


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
  "resize",
  () => {

    camera.aspect =
      innerWidth /
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


}
catch(error){

  console.error(error);

  loading.classList.add(
    "hidden"
  );

  errorBox.style.display =
    "block";

  errorBox.textContent =
    "Echo Hotel failed to load.\n\n" +
    error.message +
    "\n\nCheck the browser console for more information.";

}

</script>
